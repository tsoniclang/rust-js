[package]
name = "tsonic_rust_js"
version = "0.1.0"
edition = "2021"

[dependencies]
hashbrown = "=0.17.1"
num-bigint = "=0.4.8"
num-traits = "=0.2.19"
ryu-js = "=1.0.3"
regress = { path = "../regress", features = ["utf16"] }
tsonic_rust_runtime = "=0.1.0"
tinyvec = { version = "=1.12.0", features = ["alloc"] }
unicode-normalization = "=0.1.24"
tz-rs = "=0.7.3"
tzdb = { version = "=0.7.3", default-features = false, features = ["local"] }

[[test]]
name = "numeric_allocation_tests"
path = "../../tests/numeric_allocation_tests.rs"

[[test]]
name = "timer_ownership_tests"
path = "../../tests/js/timer_ownership_tests.rs"

[[test]]
name = "native_result_carriers"
path = "../../tests/native_result_carriers.rs"

[[test]]
name = "native_index_inputs"
path = "../../tests/native_index_inputs.rs"

[[test]]
name = "no_forbidden_shortcuts"
path = "../../tests/architecture/no_forbidden_shortcuts.rs"

[[test]]
name = "public_api_references"
path = "../../tests/architecture/public_api_references.rs"

[[test]]
name = "js_integration_tests"
path = "../../tests/js_integration_tests.rs"

[[test]]
name = "abi_ledger_tests"
path = "../../tests/abi_ledger_tests.rs"

[[test]]
